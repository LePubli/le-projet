# ==============================================================================
# TriMaint — stack complète (référence et développement local)
# ------------------------------------------------------------------------------
# La production tourne en Git Deploy DockPanel (un déploiement par service, voir
# le README) ; ce fichier reste la façon la plus simple de lancer toute la pile
# d'un coup, avec le build depuis les sources :
#
#     cp .env.example .env     # puis remplir les secrets
#     docker compose up -d --build
#
#   - Le frontend publie son port sur 127.0.0.1:7001 (cible d'un reverse proxy).
#   - Le backend n'est PAS publié : le frontend l'atteint par le réseau interne
#     (BACKEND_UPSTREAM vaut http://backend:8000 par défaut dans son image).
#   - Volumes nommés explicitement (name:) pour garder des noms stables.
# ==============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: trimaint_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - trimaint_postgres_data:/var/lib/postgresql/data
    networks:
      - trimaint_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    image: trimaint-backend:prod
    container_name: trimaint_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      UPLOAD_DIR: /data/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5/minute}
      # Bootstrap admin : mettre à 0 après le premier démarrage réussi,
      # le compte existe déjà dans la base restaurée.
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-0}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # Sauvegarde automatique quotidienne de la base
      BACKUP_ENABLED: ${BACKUP_ENABLED:-1}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      BACKUP_MINUTE: ${BACKUP_MINUTE:-00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /data/backups
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - trimaint_uploads_data:/data/uploads
      - trimaint_backups_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trimaint_net
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    image: trimaint-frontend:prod
    container_name: trimaint_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - trimaint_net
    ports:
      # Écoute locale uniquement — cible du reverse proxy DockPanel
      - "127.0.0.1:7001:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  trimaint_postgres_data:
    name: trimaint_postgres_data
  trimaint_uploads_data:
    name: trimaint_uploads_data
  trimaint_backups_data:
    name: trimaint_backups_data

networks:
  trimaint_net:
    name: trimaint_net
    driver: bridge
